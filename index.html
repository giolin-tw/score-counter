<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Score Counter</title>
  <style>
    :root {
      font-family: system-ui, sans-serif;
      color: #111;
      background: #f7f7f9;
    }

    * {
      box-sizing: border-box;
    }

    body, html {
      margin: 0;
      min-height: 100svh;
      height: 100svh;
      /* Prevent the page from scrolling; UI fits the viewport */
      overflow: hidden;
    }

    #button-grid {
      display: grid;
      grid-template-columns: 1fr;
      /* 5 equal rows that split the viewport height evenly */
      grid-template-rows: repeat(5, minmax(0, 1fr));
      height: 100svh;
      max-height: 100svh;
      width: 100vw;
      /* Ensure no implicit scrolling inside the grid */
      overflow: hidden;
    }

    .score-button {
      border: none;
      margin: 0;
      width: 100%;
      height: 100%;
      font-size: clamp(3rem, 6vw, 6rem);
      font-weight: 700;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease;
      color: white;
      border-bottom: 1px solid rgba(255, 255, 255, 0.16);
    }

    /* Palette (left -> right in the provided image):
       1 = black, 2 = very dark maroon, 3 = deep red,
       4 = strong red, 5 = brightest red */
    .score-button[data-index="1"] {
      background: #000000;
      color: #ffffff;
    }

    .score-button[data-index="2"] {
      background: #2b0000;
      color: #ffffff;
    }

    .score-button[data-index="3"] {
      background: #5a0000;
      color: #ffffff;
    }

    .score-button[data-index="4"] {
      background: #b20000;
      color: #ffffff;
    }

    .score-button[data-index="5"] {
      background: #ff0000;
      color: #ffffff;
    }

    .score-button:last-child {
      border-bottom: none;
    }

    .score-button {
      position: relative;
      overflow: hidden;
      /* Prevent selecting/copying the star characters */
      -webkit-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
      user-drag: none;
    }

    .score-button::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.24);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .score-button.clicked::after {
      opacity: 1;
    }

    .score-button:hover,
    .score-button:focus {
      transform: scale(1.02);
      filter: brightness(1.08);
      outline: none;
    }

    #results-button {
      position: fixed;
      right: 1.25rem;
      bottom: 1.25rem;
      z-index: 11;
      width: 3.6rem;
      height: 3.6rem;
      border-radius: 50%;
      border: none;
      background: #2563eb;
      color: white;
      box-shadow: 0 14px 28px rgba(38, 99, 235, 0.22);
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
    }

    #results-button:hover,
    #results-button:focus {
      background: #1d4ed8;
      outline: none;
    }

    /* Fullscreen button removed */

    dialog {
      border: none;
      border-radius: 1rem;
      padding: 1.5rem;
      width: min(480px, calc(100vw - 2rem));
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.18);
    }

    dialog::backdrop {
      background: rgba(17, 24, 39, 0.45);
      backdrop-filter: blur(2px);
    }

    .dialog-title {
      margin: 0 0 1rem;
      font-size: 1.3rem;
      font-weight: 700;
    }

    .result-list {
      list-style: none;
      padding: 0;
      margin: 0 0 1.4rem;
    }

    .result-list li {
      display: flex;
      justify-content: space-between;
      padding: 0.8rem 0;
      border-bottom: 1px solid #e2e4ea;
      font-size: 1rem;
      /* Prevent selecting/copying the star labels in the results */
      -webkit-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      user-drag: none;
    }

    .result-list li:last-child {
      border-bottom: none;
    }

    .dialog-actions {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .dialog-actions button {
      border: none;
      cursor: pointer;
      border-radius: 0.75rem;
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      font-weight: 600;
    }

    #reset-button {
      background: #ef4444;
      color: white;
    }

    #reset-button:hover,
    #reset-button:focus {
      background: #dc2626;
      outline: none;
    }

    #close-button {
      background: #e5e7eb;
      color: #111;
    }

    #close-button:hover,
    #close-button:focus {
      background: #d1d5db;
      outline: none;
    }
  </style>
</head>
<body>
    <main id="button-grid" aria-label="Score buttons">
    <button class="score-button" data-index="5" draggable="false">⭐️⭐️⭐️⭐️⭐️</button>
    <button class="score-button" data-index="4" draggable="false">⭐️⭐️⭐️⭐️</button>
    <button class="score-button" data-index="3" draggable="false">⭐️⭐️⭐️</button>
    <button class="score-button" data-index="2" draggable="false">⭐️⭐️</button>
    <button class="score-button" data-index="1" draggable="false">⭐️</button>
  </main>

  <button id="results-button" aria-label="Show results">Results</button>

  <dialog id="results-dialog">
    <h2 class="dialog-title">Click counts</h2>
    <ul class="result-list" id="result-list"></ul>
    <div class="dialog-actions">
      <button id="reset-button" type="button">Reset counts</button>
      <button id="close-button" type="button">Close</button>
    </div>
  </dialog>

  <script>
    const COOKIE_KEY = 'scoreCounterCounts';
    const buttons = document.querySelectorAll('.score-button');
    const resultsButton = document.getElementById('results-button');
    // Fullscreen control removed for better iPad behavior
    const resultsDialog = document.getElementById('results-dialog');
    const resultList = document.getElementById('result-list');
    const resetButton = document.getElementById('reset-button');
    const closeButton = document.getElementById('close-button');

    // Fullscreen API usage removed to prevent iPad system warnings

    function readCounts() {
      const raw = document.cookie
        .split('; ')
        .find((cookie) => cookie.startsWith(COOKIE_KEY + '='));
      if (!raw) return [0, 0, 0, 0, 0];
      try {
        const parsed = JSON.parse(decodeURIComponent(raw.split('=')[1]));
        if (Array.isArray(parsed) && parsed.length === 5) {
          return parsed.map((value) => Number(value) || 0);
        }
      } catch (error) {
        // ignore parse errors and reset counts
      }
      return [0, 0, 0, 0, 0];
    }

    function writeCounts(counts) {
      const expires = new Date();
      expires.setDate(expires.getDate() + 30);
      document.cookie = `${COOKIE_KEY}=${encodeURIComponent(JSON.stringify(counts))}; expires=${expires.toUTCString()}; path=/; samesite=lax`;
    }

    function updateResultList(counts) {
      const labels = ['⭐️⭐️⭐️⭐️⭐️', '⭐️⭐️⭐️⭐️', '⭐️⭐️⭐️', '⭐️⭐️', '⭐️'];
      resultList.innerHTML = '';
      counts.slice().reverse().forEach((count, index) => {
        const item = document.createElement('li');
        item.textContent = labels[index] || '';
        const value = document.createElement('span');
        value.textContent = String(count);
        item.appendChild(value);
        resultList.appendChild(item);
      });
    }

    function handleButtonClick(index, button) {
      const counts = readCounts();
      counts[index] += 1;
      writeCounts(counts);
      button.classList.add('clicked');
      window.setTimeout(() => button.classList.remove('clicked'), 200);
    }

    // Track last touch time to avoid double-counting (touch -> click)
    let lastTouchTimestamp = 0;

    buttons.forEach((button) => {
      const index = Number(button.dataset.index) - 1;

      // Count on touchstart (touch down) for touch devices
      button.addEventListener('touchstart', (e) => {
        lastTouchTimestamp = Date.now();
        handleButtonClick(index, button);
      }, { passive: true });

      // Fallback for mouse/keyboard click. Ignore click events that follow a recent touch.
      button.addEventListener('click', () => {
        const now = Date.now();
        if (now - lastTouchTimestamp < 700) return; // ignore duplicate click after touch
        handleButtonClick(index, button);
      });

      // Prevent selection/copy on touch devices when interacting quickly
      button.addEventListener('selectstart', (e) => e.preventDefault());
    });

    // Block copy events that include star characters anywhere on the page
    // make buttons non-draggable and block context menu on them
    buttons.forEach((b) => {
      try { b.draggable = false; } catch (err) {}
      b.addEventListener('contextmenu', (e) => e.preventDefault());
    });

    document.addEventListener('copy', (e) => {
      try {
        const sel = String(window.getSelection());
        // match either star + variation selector or plain star
        if (sel && /⭐/.test(sel)) {
          e.preventDefault();
        }
      } catch (err) {
        // ignore
      }
    });

    resultsButton.addEventListener('click', () => {
      const counts = readCounts();
      updateResultList(counts);
      if (typeof resultsDialog.showModal === 'function') {
        resultsDialog.showModal();
      } else {
        resultsDialog.setAttribute('open', '');
      }
    });

    // Require three quick clicks on the Reset button to avoid accidental resets
    (function setupResetTripleClick() {
      let clickCount = 0;
      let timer = null;
      const WINDOW = 800; // ms allowed between clicks

      function performReset() {
        const resetCounts = [0, 0, 0, 0, 0];
        writeCounts(resetCounts);
        updateResultList(resetCounts);
      }

      function onClick(e) {
        e.preventDefault();
        clickCount += 1;
        if (timer) clearTimeout(timer);
        timer = setTimeout(() => { clickCount = 0; timer = null; }, WINDOW);
        if (clickCount >= 3) {
          clickCount = 0;
          if (timer) { clearTimeout(timer); timer = null; }
          performReset();
        }
      }

      if (resetButton) resetButton.addEventListener('click', onClick);
    })();

    closeButton.addEventListener('click', () => {
      resultsDialog.close();
    });

    resultsDialog.addEventListener('close', () => {
      resultsDialog.removeAttribute('open');
    });

    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && resultsDialog.open) {
        resultsDialog.close();
      }
    });
  </script>
</body>
</html>
